# TEMPORARY - remove before merging PR #562.
# Repeats tests/hooks/subagent-routing.test.mjs on the runners where its
# cross-process "once" test failed (Linux, Node 24 and 26), alone and under
# parallel load, so a failure is captured with the hook's own evidence.
name: Flake probe (subagent-routing)

on:
  push:
    branches: [docs/front-page-cleanup]

permissions:
  contents: read

jobs:
  probe:
    name: Probe (Node ${{ matrix.node-version }}, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24', '26']
        mode: [serial, parallel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Repeat the test file
        env:
          NODE_OPTIONS: --experimental-vm-modules
          MODE: ${{ matrix.mode }}
        run: |
          mkdir -p probe-logs
          run_once() {
            node --experimental-vm-modules node_modules/jest/bin/jest.js \
              --config config/jest.config.js --ci tests/hooks/subagent-routing.test.mjs \
              > "probe-logs/run-$1.log" 2>&1
            echo "$1 $?" >> probe-logs/exits.txt
          }
          if [ "$MODE" = serial ]; then
            for i in $(seq 1 40); do run_once "$i"; done
          else
            # Four at a time, so the hook processes compete for CPU as they do
            # inside the full suite.
            for batch in $(seq 0 9); do
              for j in 1 2 3 4; do run_once "$((batch * 4 + j))" & done
              wait
            done
          fi
          total=$(wc -l < probe-logs/exits.txt)
          failed=$(awk '$2 != 0' probe-logs/exits.txt | wc -l)
          echo "runs=$total failed=$failed"
          for f in $(awk '$2 != 0 {print $1}' probe-logs/exits.txt); do
            echo "::group::failed run $f"
            cat "probe-logs/run-$f.log"
            echo "::endgroup::"
          done
          [ "$failed" -eq 0 ]
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-logs-node${{ matrix.node-version }}-${{ matrix.mode }}
          path: probe-logs/
