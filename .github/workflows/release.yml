name: Release

# Release-please pipeline (replaces semantic-release).
#
# Flow:
#   1. Every push to master runs release-please, which maintains a single
#      "release PR" that accumulates version bump + CHANGELOG from the
#      Conventional Commits since the last release.
#   2. Merging that release PR makes release-please cut the git tag and the
#      GitHub Release.
#   3. That release triggers `verify-release-candidate`, which installs the tarball
#      that would be published and speaks MCP to it, on ubuntu and windows.
#   4. Only if both pass does `publish-npm` build and publish to npm.
#   5. `verify-published` re-checks the real registry artifact afterwards, which is
#      the one thing that cannot be tested before publishing.
#
# npm auth (publish-npm) is OIDC-first:
#   - Preferred: npm **trusted publishing** via GitHub OIDC (no secret). Once the
#     trusted publisher is configured on npmjs.com for this repo + workflow, the
#     NPM_TOKEN secret can be deleted and publishing keeps working.
#   - Fallback/interim: the NPM_TOKEN secret. See docs/RELEASING.md.

on:
  push:
    branches:
      - master
  workflow_dispatch: {} # allow manual re-runs (gh workflow run release.yml)

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # OIDC for npm trusted publishing + provenance attestation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do NOT cancel in-progress: a cancelled run mid-publish could leave a tag
  # without its npm release.
  cancel-in-progress: false

jobs:
  # 1) Maintain the release PR; on merge, create the tag + GitHub Release.
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # config-file / manifest-file default to the repo-root files:
          #   release-please-config.json + .release-please-manifest.json

  # 2) BEFORE ANYTHING IS PUBLISHED: does this release actually work?
  #
  #    Nothing used to answer that. `verify:package-contents` reads the tarball's file list, and the
  #    unit suite imports from the working tree -- neither installs anything, so the pipeline
  #    published artifacts that had never been installed. That is the defect class behind v7.0.0
  #    (tagged, no npm package) and 7.0.1 (on npm, would not start), both found by users.
  #
  #    This packs the tarball `npm publish` would upload, installs it into a throwaway prefix, runs
  #    the real postinstall, imports every entry point from the installed tree, drives the
  #    documented recovery command, and then speaks MCP to the installed server and asks for its
  #    tools. On both platforms people run it on.
  #
  #    `npm pack` produces the exact bytes `npm publish` uploads, so this tests the release itself
  #    rather than a stand-in -- and it does so while failing is still free. A red platform here
  #    means no publish happened at all: there is nothing to unpublish, and no version number is
  #    burned, because npm only refuses to reuse a version that was actually published.
  verify-release-candidate:
    name: Verify the release installs and runs (${{ matrix.os }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # Both platforms report. Stopping the matrix at the first failure would hide whether the
      # release is broken everywhere or only on one OS, which is the first thing to know.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # THE SAME STAMP AND BUILD THE PUBLISH JOB PERFORMS, in the same order, from the same tag.
      # Skipping either would test a tarball that differs from the published one in exactly the
      # place (the version stamped into the packaged hooks) that has broken releases before.
      - name: Stamp the shipped version into the packaged hooks
        run: npm run stamp:version

      - name: Build project
        run: npm run build

      # No prepack hook exists, so `npm pack` ships whatever dist/ holds: this must follow the build.
      - name: Install the packed tarball and speak MCP to it
        run: npm run verify:install

  # 3) On an actual release, build and publish to npm.
  publish-npm:
    name: Publish to npm
    needs: [release-please, verify-release-candidate]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing + provenance
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm (>= 11.5.1 supports OIDC trusted publishing)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # VERIFY, AND DO NOT REPAIR FIRST. Regenerating before the check made the check
      # meaningless: `sync:hooks` rewrote the generated files, so `sync:hooks:check`
      # then compared the repaired tree against itself and passed even when the RELEASED
      # TAG contained stale generated output. The publish could ship files that did not
      # match the tag it claims to be built from, which is the one thing the
      # provenance attestation is supposed to rule out.
      #
      # The repair existed because a release used to knock the pinned specs out of step
      # every time. It no longer can: the specs say `@latest`, which does not change
      # when package.json does. With nothing left to repair, the regeneration only
      # masked real generator drift.
      #
      # Generated output must therefore be committed before the tag is cut. The
      # `generated-artifacts` job in quality-gates.yml runs this same check on every
      # push, so drift is caught long before a release.
      - name: Verify generated configs match their generators
        run: npm run sync:hooks:check

      # AFTER the drift check and BEFORE the tarball is built, which is the only
      # window where both can hold. The version is deliberately absent from git:
      # a version literal in a generated-and-committed file makes "generated
      # output == committed file" an invariant that cannot survive a release
      # commit, because release-please bumps package.json without regenerating.
      # That invariant has cost this project three releases -- v5.4.0, v5.4.1 and
      # v5.7.1 were all tagged with GitHub Releases and none reached npm -- and
      # it cannot be repaired on master, because this job checks out the TAG.
      #
      # So git carries no version and the tarball carries an exact one. The step
      # must stay above `Generate CHECKSUMS.sha256`, which hashes exactly what
      # ships; a stamp applied after it would ship files the checksums disown.
      - name: Stamp the shipped version into the packaged hooks
        run: npm run stamp:version

      - name: Build project
        run: npm run build

      - name: Verify build artifacts
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not created"
            exit 1
          fi
          echo "Build artifacts verified successfully"

      - name: Verify npm client entrypoints and manifests
        run: npm run verify:package-contents

      # Offline verification, alongside (not instead of) the provenance
      # attestation the publish below produces. Generated from the built tree so
      # it hashes exactly what ships.
      - name: Generate CHECKSUMS.sha256
        run: node scripts/checksums.mjs

      - name: Attach CHECKSUMS.sha256 to the release
        if: ${{ needs.release-please.outputs.tag_name != '' }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" CHECKSUMS.sha256 --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Publish to npm (provenance; OIDC trusted publishing or NPM_TOKEN)
        # If a trusted publisher is configured on npmjs.com, npm uses OIDC and
        # NODE_AUTH_TOKEN can be empty. Until then, the NPM_TOKEN secret is used.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # 2b) Prove the PUBLISHED package installs and starts through the plugin's own launcher, on both
  #     platforms users run it on. v7.0.0 shipped a tag with no npm package and 7.0.1 reached npm
  #     while installed plugins kept serving 6.0.2; both were found by users. A failure here opens
  #     an issue immediately instead.
  # 2c) The official MCP registry, which nothing has ever published to.
  #
  #     server.json is version-stamped by release-please on every release (it is in
  #     release-please-config.json's extra-files) and then goes nowhere: no workflow and no npm
  #     script has ever run a publisher. The registry therefore serves 5.1.1 while npm serves
  #     7.1.0 -- two majors of drift, and the kind of gap nobody notices because the file in the
  #     repo always looks current.
  #
  #     No secret is needed. The registry maps a GitHub OIDC token to the `io.github.<owner>/*`
  #     namespace, and server.json is named io.github.ooples/token-optimizer-mcp, so the OIDC
  #     subject already proves the right to publish it. package.json carries the `mcpName`
  #     ownership marker the registry checks against the npm package.
  publish-mcp-registry:
    name: Publish to the MCP registry
    needs: [release-please, publish-npm]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # the OIDC token IS the credential here
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      # THE REGISTRY VALIDATES THAT THE NPM PACKAGE EXISTS, and npm's own publish is eventually
      # consistent -- it answers "being processed and may take a few minutes to become available".
      # Publishing straight after `npm publish` therefore races, and the failure is a rejection of
      # a version that is perfectly fine seconds later.
      - name: Wait for npm to serve the released version
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          deadline=$(( $(date +%s) + 600 ))
          until [ "$(npm view "@ooples/token-optimizer-mcp@$RELEASE_VERSION" version --prefer-online 2>/dev/null)" = "$RELEASE_VERSION" ]; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::npm is not serving $RELEASE_VERSION after 10 minutes; not publishing to the registry"
              exit 1
            fi
            echo "waiting for @ooples/token-optimizer-mcp@$RELEASE_VERSION on npm..."
            sleep 20
          done

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz"             | tar xz mcp-publisher
          ./mcp-publisher --version || true

      - name: Publish server.json over GitHub OIDC
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      # READ IT BACK. A publish that reports success while the registry still serves the old
      # version is the documented failure here: a description over 100 characters returns 422 and
      # projects have sat on a phantom version for months without noticing.
      - name: Confirm the registry serves the new version
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          served=$(curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers?search=token-optimizer-mcp"             | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          rows = d.get('servers', d.get('data', []))
          ours = [s for s in rows if 'io.github.ooples/token-optimizer-mcp' in json.dumps(s)]
          def ver(s):
              return s.get('version') or s.get('server', {}).get('version', '0')
          # Numeric compare: max() over strings makes '9.0.0' beat '10.0.0'.
          def key(v):
              return tuple(int(p) for p in v.split('.') if p.isdigit())
          print(max((ver(s) for s in ours), key=key, default='none'))
          ")
          echo "registry highest version for our server: $served (released $RELEASE_VERSION)"
          [ "$served" = "$RELEASE_VERSION" ] || {
            echo "::error::registry serves $served, not $RELEASE_VERSION"
            exit 1
          }

  verify-published:
    name: Verify published release (${{ matrix.os }})
    needs: [release-please, publish-npm]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          # This job runs package scripts from the released tag; without this, checkout leaves a
          # token with issues: write in the local git config for them to read.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and launch the published version through plugin/launch.mjs
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: npm run verify:published-launch -- --version "$RELEASE_VERSION" --wait-minutes 20
        shell: bash

      - name: Open an issue when the published release does not start
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "v$RELEASE_VERSION does not install or start through the plugin launcher (${{ matrix.os }})" --body "The post-publish verification failed for v$RELEASE_VERSION on ${{ matrix.os }}: $RUN_URL. Users installing or updating the plugin are affected until this is fixed."

  # 3) Fan-out notifications, mirroring the previous pipeline. All optional and
  #    skipped silently when the corresponding repo variable/secret is absent.
  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [release-please, publish-npm]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - name: Compute release links
        id: links
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          TAG="${{ needs.release-please.outputs.tag_name }}"
          echo "release_url=https://github.com/${{ github.repository }}/releases/tag/${TAG}" >> "$GITHUB_OUTPUT"
          echo "npm_url=https://www.npmjs.com/package/@ooples/token-optimizer-mcp/v/${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Post to Discord (if configured)
        if: vars.DISCORD_WEBHOOK_URL != ''
        run: |
          MSG="New release: token-optimizer-mcp ${{ needs.release-please.outputs.tag_name }}\nRelease notes: ${{ steps.links.outputs.release_url }}\nnpm: ${{ steps.links.outputs.npm_url }}"
          curl -X POST "${{ vars.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"$MSG\"}" || echo "Discord notification failed (optional)"

      - name: Post to Slack (if configured)
        if: vars.SLACK_WEBHOOK_URL != ''
        run: |
          MSG="New release: token-optimizer-mcp ${{ needs.release-please.outputs.tag_name }}\nRelease notes: ${{ steps.links.outputs.release_url }}\nnpm: ${{ steps.links.outputs.npm_url }}"
          curl -X POST "${{ vars.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"$MSG\"}" || echo "Slack notification failed (optional)"

      - name: Email release notification (if configured)
        if: vars.RELEASE_EMAIL_TO != ''
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: 'token-optimizer-mcp ${{ needs.release-please.outputs.tag_name }} released'
          to: ${{ vars.RELEASE_EMAIL_TO }}
          from: token-optimizer-mcp CI <${{ secrets.SMTP_FROM || secrets.SMTP_USERNAME }}>
          body: |
            A new version of token-optimizer-mcp has been published.

            Version:       ${{ needs.release-please.outputs.tag_name }}
            Release notes: ${{ steps.links.outputs.release_url }}
            npm:           ${{ steps.links.outputs.npm_url }}

            — automated by the release pipeline

      - name: Comment on resolved issues
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ needs.release-please.outputs.tag_name }}';
            const version = '${{ needs.release-please.outputs.version }}';
            const releaseUrl = '${{ steps.links.outputs.release_url }}';
            let body = '';
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              body = release.body || '';
            } catch (e) {
              console.log('Could not load release body:', e.message);
              return;
            }
            const issueNumbers = [...new Set(
              (body.match(/#(\d+)/g) || []).map((m) => parseInt(m.slice(1), 10))
            )];
            for (const issueNumber of issueNumbers) {
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `This issue has been resolved in version ${version}.\n\nRelease notes: ${releaseUrl}`,
                });
              } catch (error) {
                console.log(`Failed to comment on issue #${issueNumber}:`, error.message);
              }
            }

      - name: Update release summary
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "Version: ${{ needs.release-please.outputs.tag_name }}"
            echo "Release URL: ${{ steps.links.outputs.release_url }}"
            echo "npm URL: ${{ steps.links.outputs.npm_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
