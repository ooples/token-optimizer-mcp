name: Release

# Release-please pipeline (replaces semantic-release).
#
# Flow:
#   1. Every push to master runs release-please, which maintains a single
#      "release PR" that accumulates version bump + CHANGELOG from the
#      Conventional Commits since the last release.
#   2. Merging that release PR makes release-please cut the git tag and the
#      GitHub Release.
#   3. That release triggers `publish-npm`, which builds and publishes to npm.
#
# npm auth (publish-npm) is OIDC-first:
#   - Preferred: npm **trusted publishing** via GitHub OIDC (no secret). Once the
#     trusted publisher is configured on npmjs.com for this repo + workflow, the
#     NPM_TOKEN secret can be deleted and publishing keeps working.
#   - Fallback/interim: the NPM_TOKEN secret. See docs/RELEASING.md.

on:
  push:
    branches:
      - master
  workflow_dispatch: {} # allow manual re-runs (gh workflow run release.yml)

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # OIDC for npm trusted publishing + provenance attestation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do NOT cancel in-progress: a cancelled run mid-publish could leave a tag
  # without its npm release.
  cancel-in-progress: false

jobs:
  # 1) Maintain the release PR; on merge, create the tag + GitHub Release.
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # config-file / manifest-file default to the repo-root files:
          #   release-please-config.json + .release-please-manifest.json

      # THE PINS MUST BE BUMPED INSIDE THE RELEASE PR, and this is the only place
      # that can do it.
      #
      # release-please bumps package.json and plugin.json (its extra-files) but not
      # the pinned client specs, which carry `@ooples/token-optimizer-mcp@<version>`
      # in strings that release-please's json/generic updaters cannot rewrite. The
      # previous design delegated that to sync-release-pins.yml on `pull_request` --
      # but release-please opens its PR with GITHUB_TOKEN, and GitHub deliberately
      # suppresses workflow runs from that token to prevent recursion. Those runs sat
      # in `action_required` and never executed.
      #
      # The cost was not theoretical: v5.4.0 and v5.4.1 were both tagged, both had
      # GitHub Releases, and NEITHER reached npm -- the publish guard correctly
      # refused a version whose pins still said the previous one, twice, and npm
      # stayed on 5.3.6 while master said 5.4.1.
      #
      # This job is triggered by push to master, an ordinary event, so it runs. It
      # amends the release PR rather than publishing unsynced content, which keeps the
      # tag authoritative: the tarball is still built from the tagged commit, so the
      # provenance attestation continues to mean what it says.
      - name: Check out for the pin sync
        if: ${{ steps.release.outputs.pr != '' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node for the pin sync
        if: ${{ steps.release.outputs.pr != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Sync pinned specs into the release PR
        if: ${{ steps.release.outputs.pr != '' }}
        env:
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail

          BRANCH="$(printf '%s' "$PR_JSON" | jq -r '.headBranchName')"
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "null" ]; then
            echo "::error::release-please reported a PR with no head branch"
            exit 1
          fi

          # Same guard as the workflow this replaces: only ever amend a branch
          # release-please owns, never an arbitrary contributor's.
          case "$BRANCH" in
            release-please--*) ;;
            *)
              echo "::error::Refusing to sync '$BRANCH': only release-please branches are amended automatically."
              exit 1
              ;;
          esac

          git fetch origin "$BRANCH"
          git checkout "$BRANCH"

          # --ignore-scripts: the sync only needs the generator scripts and their
          # deps, not a full postinstall.
          npm ci --ignore-scripts
          npm run sync:hooks

          if git diff --quiet; then
            echo "pinned specs already match the release version"
            exit 0
          fi

          echo "Pinned specs updated by the sync:"
          git diff --stat

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: sync pinned specs to the release version"
          git push origin "HEAD:$BRANCH"

  # 2) On an actual release, build and publish to npm.
  publish-npm:
    name: Publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing + provenance
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm (>= 11.5.1 supports OIDC trusted publishing)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # A release is the ONLY event that can introduce pin drift, because
      # release-please bumps package.json without touching the specs pinned
      # inside the hand-maintained client configs. Publishing that tree ships
      # hooks at the new version calling an MCP server at the old one.
      #
      # This fails the publish rather than repairing the tree: the tag is
      # already cut, so silently publishing something different from the tag
      # would be worse than stopping. The sync-release-pins job below is what
      # keeps it from getting this far.
      - name: Verify pinned specs match the released version
        run: npm run sync:hooks:check

      - name: Build project
        run: npm run build

      - name: Verify build artifacts
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not created"
            exit 1
          fi
          echo "Build artifacts verified successfully"

      # Offline verification, alongside (not instead of) the provenance
      # attestation the publish below produces. Generated from the built tree so
      # it hashes exactly what ships.
      - name: Generate CHECKSUMS.sha256
        run: node scripts/checksums.mjs

      - name: Attach CHECKSUMS.sha256 to the release
        if: ${{ needs.release-please.outputs.tag_name != '' }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" CHECKSUMS.sha256 --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Publish to npm (provenance; OIDC trusted publishing or NPM_TOKEN)
        # If a trusted publisher is configured on npmjs.com, npm uses OIDC and
        # NODE_AUTH_TOKEN can be empty. Until then, the NPM_TOKEN secret is used.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # 3) Fan-out notifications, mirroring the previous pipeline. All optional and
  #    skipped silently when the corresponding repo variable/secret is absent.
  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [release-please, publish-npm]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - name: Compute release links
        id: links
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          TAG="${{ needs.release-please.outputs.tag_name }}"
          echo "release_url=https://github.com/${{ github.repository }}/releases/tag/${TAG}" >> "$GITHUB_OUTPUT"
          echo "npm_url=https://www.npmjs.com/package/@ooples/token-optimizer-mcp/v/${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Post to Discord (if configured)
        if: vars.DISCORD_WEBHOOK_URL != ''
        run: |
          MSG="New release: token-optimizer-mcp ${{ needs.release-please.outputs.tag_name }}\nRelease notes: ${{ steps.links.outputs.release_url }}\nnpm: ${{ steps.links.outputs.npm_url }}"
          curl -X POST "${{ vars.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"$MSG\"}" || echo "Discord notification failed (optional)"

      - name: Post to Slack (if configured)
        if: vars.SLACK_WEBHOOK_URL != ''
        run: |
          MSG="New release: token-optimizer-mcp ${{ needs.release-please.outputs.tag_name }}\nRelease notes: ${{ steps.links.outputs.release_url }}\nnpm: ${{ steps.links.outputs.npm_url }}"
          curl -X POST "${{ vars.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"$MSG\"}" || echo "Slack notification failed (optional)"

      - name: Email release notification (if configured)
        if: vars.RELEASE_EMAIL_TO != ''
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: 'token-optimizer-mcp ${{ needs.release-please.outputs.tag_name }} released'
          to: ${{ vars.RELEASE_EMAIL_TO }}
          from: token-optimizer-mcp CI <${{ secrets.SMTP_FROM || secrets.SMTP_USERNAME }}>
          body: |
            A new version of token-optimizer-mcp has been published.

            Version:       ${{ needs.release-please.outputs.tag_name }}
            Release notes: ${{ steps.links.outputs.release_url }}
            npm:           ${{ steps.links.outputs.npm_url }}

            — automated by the release pipeline

      - name: Comment on resolved issues
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ needs.release-please.outputs.tag_name }}';
            const version = '${{ needs.release-please.outputs.version }}';
            const releaseUrl = '${{ steps.links.outputs.release_url }}';
            let body = '';
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              body = release.body || '';
            } catch (e) {
              console.log('Could not load release body:', e.message);
              return;
            }
            const issueNumbers = [...new Set(
              (body.match(/#(\d+)/g) || []).map((m) => parseInt(m.slice(1), 10))
            )];
            for (const issueNumber of issueNumbers) {
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `This issue has been resolved in version ${version}.\n\nRelease notes: ${releaseUrl}`,
                });
              } catch (error) {
                console.log(`Failed to comment on issue #${issueNumber}:`, error.message);
              }
            }

      - name: Update release summary
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "Version: ${{ needs.release-please.outputs.tag_name }}"
            echo "Release URL: ${{ steps.links.outputs.release_url }}"
            echo "npm URL: ${{ steps.links.outputs.npm_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
