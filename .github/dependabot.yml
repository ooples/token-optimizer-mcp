version: 2

updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"

    # One PR per kind of update, not one per package. Every PR runs the full
    # pipeline on the shared runner pool, and separate bumps conflict in
    # package-lock.json: each merge leaves the others dirty. On 2026-11-13
    # hono and @hono/node-server arrived as two PRs (#566, #569) because
    # security updates ignore groups unless a group applies to them, and the
    # old split (development minor+patch, production patch only) sent every
    # production minor bump on its own. Majors stay separate on purpose: a
    # breaking bump that has to be held must not hold the week's patches.
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

    # include: "scope" adds "(deps)" or "(deps-dev)" itself, so the prefix is
    # the bare type; a scoped prefix gave "chore(deps)(deps): bump ...".
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

    # Automatically approve and merge patch updates (optional)
    open-pull-requests-limit: 10

    # Assignees and reviewers
    reviewers:
      - "ooples"

    # Labels for PRs
    labels:
      - "dependencies"
      - "automated"

    # Versioning strategy
    versioning-strategy: "increase"

    # Ignore specific dependencies (if needed)
    # An ignore list must hold at least one entry: an empty `ignore:` is null,
    # which Dependabot rejects for the whole file. To hold a dependency back:
    # ignore:
    #   - dependency-name: "typescript"
    #     update-types: ["version-update:semver-major"]

    # No allow list: the defaults are what is wanted. Version updates cover
    # explicitly defined dependencies, and security updates cover every
    # dependency in the lock file. An "allow: dependency-type: all" also
    # opened a version update for each transitive package (@babel/types,
    # conventional-changelog-writer, ...), outside the group: on 2026-11-14
    # five patch bumps arrived as separate PRs beside the grouped one. allow
    # applies to security updates too, so narrowing it to "direct" instead
    # could have dropped security fixes for transitive packages.

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"

    commit-message:
      prefix: "ci"
      include: "scope"

    labels:
      - "github-actions"
      - "automated"

    # Every minor and patch action bump in one PR; a pinned-SHA change does not
    # need its own run. Majors stay separate, so one held back holds nothing else.
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]

    reviewers:
      - "ooples"
